openapi: 3.1.0
info:
  title: SANDIG internal API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8001
security:
  - serviceToken: []
paths:
  /api/v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process is reachable; dependencies are not checked.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /api/v1/models:
    get:
      operationId: models
      responses:
        '200':
          description: Installed local Ollama chat models and default model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelsResponse' }
        '401': { description: Missing or invalid service token. }
  /api/v1/chat:
    post:
      operationId: chat
      description: Local Ollama AI chat backed by optional RAG documents, live weather/USGS feeds, web search, conversation history, and deterministic emergency short-circuit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Chat outcome, including safety and evidence limitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '401': { description: Missing or invalid service token. }
        '422': { description: Invalid request; do not echo raw input. }
        '429': { description: Request limit reached. }
        '503': { description: No safe response could be produced. }
  /api/v1/chat/stream:
    post:
      operationId: chat_stream
      description: Streaming NDJSON chat endpoint yielding meta, token, and done events from local Ollama.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: NDJSON stream of chat metadata and tokens.
        '401': { description: Missing or invalid service token. }
        '422': { description: Invalid request; do not echo raw input. }
  /api/v1/locations/barangays:
    get:
      operationId: barangays
      responses:
        '200':
          description: Dated Baguio barangay names and codes, not geographic evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarangayCatalog' }
        '401': { description: Missing or invalid service token. }
        '503': { description: Local catalog unavailable. }
  /api/v1/sources:
    get:
      operationId: sources
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque continuation returned by the previous page; restart after token rotation.
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Page of active approved source metadata within its review window.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Source' }
                  next_cursor: { type: [string, 'null'] }
        '401': { description: Missing or invalid service token. }
        '422': { description: Invalid pagination parameters. }
        '503': { description: Source catalog unavailable. }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer }
  schemas:
    ModelEntry:
      type: object
      required: [name]
      properties:
        name: { type: string }
        size: { type: integer, default: 0 }
    ModelsResponse:
      type: object
      required: [default_model, models]
      properties:
        default_model: { type: string }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelEntry' }
    Barangay:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: '^1430300[0-9]{3}$' }
        name: { type: string, minLength: 1 }
    BarangaySource:
      type: object
      required: [publisher, url, as_of]
      properties:
        publisher: { type: string }
        url: { type: string, pattern: '^https://' }
        as_of: { type: string, format: date }
    BarangayCatalog:
      type: object
      required: [barangays, source]
      properties:
        barangays:
          type: array
          items: { $ref: '#/components/schemas/Barangay' }
        source: { $ref: '#/components/schemas/BarangaySource' }
    HistoryMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
    UserLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: [number, 'null'], minimum: 0, maximum: 100000, default: null }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
        conversation_id: { type: [string, 'null'], format: uuid, default: null }
        barangay_id: { type: [string, 'null'], minLength: 1, maxLength: 64, default: null }
        language: { type: string, enum: [en, fil, auto], default: en }
        response_detail: { type: string, enum: [brief, standard, detailed], default: standard }
        allow_web_search: { type: boolean, default: false }
        auto_web_search: { type: boolean, default: false }
        history:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/HistoryMessage' }
        model: { type: [string, 'null'], minLength: 1, maxLength: 128, default: null }
        temperature: { type: [number, 'null'], minimum: 0, maximum: 1.5, default: null }
        top_p: { type: [number, 'null'], minimum: 0.1, maximum: 1, default: null }
        max_tokens: { type: [integer, 'null'], minimum: 64, maximum: 2048, default: null }
        num_ctx: { type: [integer, 'null'], minimum: 1024, maximum: 16384, default: null }
        system_prompt: { type: [string, 'null'], maxLength: 2000, default: null }
        location: { anyOf: [{ $ref: '#/components/schemas/UserLocation' }, { type: 'null' }], default: null }
    ChatResponse:
      type: object
      required: [answer, language, response_type, evidence_status, citations, web_search_used, checked_at]
      properties:
        answer: { type: string, minLength: 1 }
        response_type:
          type: string
          enum: [preparedness, hazard_assessment, live_update, general_information, refusal, emergency]
        evidence_status:
          type: string
          enum: [supported, partially_supported, insufficient_evidence, out_of_scope, emergency, not_applicable]
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        web_search_used: { type: boolean }
        language: { type: string, enum: [en, fil] }
        checked_at: { type: [string, 'null'], format: date-time }
        model: { type: [string, 'null'], default: null }
    Source:
      type: object
      required: [source_id, title, publisher, version, verification_status]
      properties:
        source_id: { type: string }
        title: { type: string }
        publisher: { type: string }
        url: { type: [string, 'null'], format: uri, pattern: '^https://' }
        publication_date: { type: [string, 'null'], format: date }
        retrieval_date: { type: [string, 'null'], format: date }
        jurisdiction: { type: [string, 'null'] }
        hazards:
          type: array
          items: { type: string }
        version: { type: string }
        verification_status: { const: approved }
        usage_restrictions: { type: [string, 'null'] }
    Citation:
      type: object
      required: [kind, title, publisher]
      properties:
        kind: { type: string, enum: [indexed_document, official_live, supplementary_live, web_search, curated_guidance] }
        source_id: { type: [string, 'null'] }
        version: { type: [string, 'null'] }
        title: { type: string }
        publisher: { type: string }
        url: { type: [string, 'null'], format: uri, pattern: '^https://' }
        page: { type: [integer, 'null'], minimum: 1 }
        section: { type: [string, 'null'] }
        publication_date: { type: [string, 'null'], format: date }
        observed_at: { type: [string, 'null'], format: date-time }
        passage: { type: [string, 'null'] }
